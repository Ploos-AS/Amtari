name: CI

on:
  push:
  pull_request:

concurrency:
  group: amtari-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make check

  m2-11-cross-compiled-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install m68k cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-m68k-linux-gnu binutils-m68k-linux-gnu
      - name: Build and execute real m68k C PRG
        run: make cross-check
